<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <!-- ===== Shared gradients & filters ===== -->
    <linearGradient id="orangeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb56b"/>
      <stop offset=".5" stop-color="#f58220"/>
      <stop offset="1" stop-color="#c45a18"/>
    </linearGradient>
    <linearGradient id="orangeBodySoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc890"/>
      <stop offset=".55" stop-color="#f59a47"/>
      <stop offset="1" stop-color="#d26911"/>
    </linearGradient>
    <linearGradient id="orangeHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e07b1a"/>
      <stop offset="1" stop-color="#7a3500"/>
    </linearGradient>
    <linearGradient id="paperLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ece1"/>
    </linearGradient>
    <linearGradient id="paperEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ede0"/>
      <stop offset="1" stop-color="#d8cfbe"/>
    </linearGradient>
    <linearGradient id="laptopBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4148"/>
      <stop offset="1" stop-color="#1f2227"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="1" stop-color="#2a2d33"/>
    </linearGradient>
    <linearGradient id="laptopBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e07b1a"/>
      <stop offset="1" stop-color="#a04500"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff0e2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff0e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinGloss" cx=".35" cy=".25" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cupBody" cx=".4" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffb56b"/>
      <stop offset=".6" stop-color="#f58220"/>
      <stop offset="1" stop-color="#a04500"/>
    </radialGradient>
    <radialGradient id="cupSteam" cx=".5" cy=".3" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadowSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ===== 1. البحث والمقارنة — magnifying glass with compare bars ===== -->
    <symbol id="icon-search" viewBox="0 0 120 120">
      <g filter="url(#softShadow)">
        <rect x="72" y="72" width="40" height="13" rx="6.5" transform="rotate(45 72 72)" fill="url(#orangeHandle)"/>
        <circle cx="50" cy="50" r="36" fill="url(#orangeBody)"/>
        <circle cx="50" cy="50" r="25" fill="url(#paperLight)"/>
        <circle cx="50" cy="50" r="25" fill="url(#lensGlow)"/>
        <ellipse cx="40" cy="40" rx="10" ry="6" fill="#ffffff" opacity=".55" transform="rotate(-30 40 40)"/>
        <rect x="36" y="42" width="13" height="3.4" rx="1.6" fill="#f58220"/>
        <rect x="36" y="49" width="22" height="3.4" rx="1.6" fill="#f58220"/>
        <rect x="36" y="56" width="17" height="3.4" rx="1.6" fill="#f58220"/>
      </g>
    </symbol>

    <!-- ===== 2. الحضور عنك والتنفيذ — location pin with person silhouette ===== -->
    <symbol id="icon-attend" viewBox="0 0 120 120">
      <g filter="url(#softShadow)">
        <ellipse cx="60" cy="108" rx="14" ry="3.5" fill="#000" opacity=".14"/>
        <path d="M60 14 C84 14 96 32 96 50 C96 70 78 90 60 108 C42 90 24 70 24 50 C24 32 36 14 60 14 Z"
              fill="url(#orangeBody)"/>
        <path d="M60 14 C84 14 96 32 96 50 C96 58 93 66 89 73 C84 60 76 52 60 50 C44 52 36 60 31 73 C27 66 24 58 24 50 C24 32 36 14 60 14 Z"
              fill="#ffffff" opacity=".22"/>
        <circle cx="60" cy="50" r="17" fill="#fffaf3"/>
        <circle cx="60" cy="44" r="6.5" fill="url(#orangeBodySoft)"/>
        <path d="M46 64 C48 56 54 53 60 53 C66 53 72 56 74 64 Z" fill="url(#orangeBodySoft)"/>
        <ellipse cx="52" cy="28" rx="14" ry="7" fill="#ffffff" opacity=".45" transform="rotate(-22 52 28)"/>
      </g>
    </symbol>

    <!-- ===== 3. الإشراف على التنفيذ — clipboard with progress + eye ===== -->
    <symbol id="icon-supervise" viewBox="0 0 120 120">
      <g filter="url(#softShadow)">
        <ellipse cx="60" cy="108" rx="22" ry="3.5" fill="#000" opacity=".14"/>
        <rect x="22" y="20" width="68" height="84" rx="8" fill="url(#paperEdge)"/>
        <rect x="26" y="24" width="60" height="76" rx="6" fill="url(#paperLight)"/>
        <rect x="44" y="14" width="24" height="14" rx="4" fill="url(#orangeHandle)"/>
        <rect x="48" y="17" width="16" height="8" rx="2" fill="#a04500"/>
        <circle cx="40" cy="48" r="9" fill="none" stroke="url(#orangeBodySoft)" stroke-width="3"/>
        <circle cx="40" cy="48" r="4" fill="url(#orangeBodySoft)"/>
        <circle cx="34" cy="44" r="1.6" fill="#ffffff" opacity=".8"/>
        <rect x="55" y="44" width="26" height="3.4" rx="1.6" fill="#d8cfbe"/>
        <rect x="55" y="51" width="20" height="3.4" rx="1.6" fill="#d8cfbe"/>
        <rect x="32" y="68" width="50" height="6" rx="3" fill="#f0e6d4"/>
        <rect x="32" y="68" width="36" height="6" rx="3" fill="url(#orangeBody)"/>
        <path d="M52 82 L57 87 L68 76" stroke="url(#orangeBody)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="28" y="90" width="20" height="3.4" rx="1.6" fill="#d8cfbe"/>
      </g>
    </symbol>

    <!-- ===== 4. المراجعة والمتابعة — document stack with magnifier ===== -->
    <symbol id="icon-review" viewBox="0 0 120 120">
      <g filter="url(#softShadow)">
        <ellipse cx="58" cy="104" rx="32" ry="4" fill="#000" opacity=".14"/>
        <rect x="22" y="48" width="58" height="60" rx="5" fill="url(#paperEdge)" transform="rotate(-8 51 78)"/>
        <rect x="22" y="40" width="58" height="60" rx="5" fill="url(#paperLight)" transform="rotate(-8 51 70)"/>
        <rect x="22" y="32" width="58" height="60" rx="5" fill="#ffffff" transform="rotate(-8 51 62)"/>
        <g transform="rotate(-8 51 62)">
          <rect x="30" y="42" width="42" height="3.4" rx="1.6" fill="#e3d8c2"/>
          <rect x="30" y="50" width="36" height="3.4" rx="1.6" fill="#e3d8c2"/>
          <rect x="30" y="58" width="40" height="3.4" rx="1.6" fill="#e3d8c2"/>
          <rect x="30" y="66" width="30" height="3.4" rx="1.6" fill="#e3d8c2"/>
          <rect x="30" y="74" width="34" height="3.4" rx="1.6" fill="#e3d8c2"/>
        </g>
        <rect x="62" y="58" width="44" height="12" rx="6" transform="rotate(40 62 58)" fill="url(#orangeHandle)"/>
        <circle cx="76" cy="44" r="22" fill="url(#orangeBody)"/>
        <circle cx="76" cy="44" r="15" fill="#fffaf3"/>
        <circle cx="76" cy="44" r="15" fill="url(#lensGlow)"/>
        <ellipse cx="70" cy="38" rx="6" ry="3.5" fill="#ffffff" opacity=".55" transform="rotate(-30 70 38)"/>
      </g>
    </symbol>

    <!-- ===== 5. التنسيق والترتيب — calendar with check + binding rings ===== -->
    <symbol id="icon-calendar" viewBox="0 0 120 120">
      <g filter="url(#softShadow)">
        <ellipse cx="60" cy="108" rx="32" ry="4" fill="#000" opacity=".14"/>
        <rect x="30" y="14" width="6" height="18" rx="2.5" fill="url(#orangeHandle)"/>
        <rect x="84" y="14" width="6" height="18" rx="2.5" fill="url(#orangeHandle)"/>
        <rect x="20" y="24" width="80" height="80" rx="9" fill="url(#paperEdge)"/>
        <rect x="20" y="24" width="80" height="22" fill="url(#orangeBody)"/>
        <rect x="20" y="24" width="80" height="80" rx="9" fill="none" stroke="#a04500" stroke-width="1" opacity=".25"/>
        <rect x="26" y="52" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="44" y="52" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="62" y="52" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="80" y="52" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="26" y="68" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="44" y="68" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="62" y="68" width="14" height="12" rx="2" fill="#fffaf3"/>
        <rect x="80" y="68" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="26" y="84" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="44" y="84" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="62" y="84" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <rect x="80" y="84" width="14" height="12" rx="2" fill="#f0e6d4"/>
        <path d="M64 74 L68 78 L76 70" stroke="url(#orangeBody)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="60" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fffaf3" text-anchor="middle" opacity=".9">JUN</text>
      </g>
    </symbol>

    <!-- ===== 6. المهام الإلكترونية — laptop with task list ===== -->
    <symbol id="icon-laptop" viewBox="0 0 120 120">
      <g filter="url(#softShadow)">
        <ellipse cx="60" cy="100" rx="36" ry="4" fill="#000" opacity=".18"/>
        <path d="M18 88 L102 88 L98 78 L22 78 Z" fill="url(#orangeHandle)"/>
        <rect x="22" y="78" width="76" height="4" rx="2" fill="#a04500"/>
        <rect x="28" y="22" width="64" height="58" rx="4" fill="url(#laptopBody)"/>
        <rect x="32" y="26" width="56" height="50" rx="2" fill="url(#laptopScreen)"/>
        <rect x="36" y="30" width="48" height="3.2" rx="1.5" fill="#f58220"/>
        <rect x="36" y="38" width="32" height="2.6" rx="1.2" fill="#9da2a8"/>
        <rect x="36" y="44" width="38" height="2.6" rx="1.2" fill="#9da2a8"/>
        <rect x="36" y="50" width="28" height="2.6" rx="1.2" fill="#9da2a8"/>
        <rect x="36" y="56" width="34" height="2.6" rx="1.2" fill="#9da2a8"/>
        <rect x="36" y="62" width="22" height="2.6" rx="1.2" fill="#9da2a8"/>
        <circle cx="56" cy="72" r="1.5" fill="#9da2a8" opacity=".5"/>
        <ellipse cx="80" cy="30" rx="6" ry="3" fill="#ffffff" opacity=".18"/>
      </g>
    </symbol>
  </defs>
</svg>
